spring:
  application:
    name: tg-connector
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tgconnector}
    username: ${DB_USER:tgconnector}
    password: ${DB_PASSWORD:}
  ai:
    mcp:
      server:
        # Streamable HTTP endpoint at /mcp, used by claude.ai custom connectors.
        # Must be set explicitly: without it Spring AI falls back to the legacy SSE transport.
        protocol: STREAMABLE
        name: telegram-connector
        version: 0.1.0
        instructions: >
          Reads Telegram public channels and chats where the connector's bot is a member.
          Messages are collected from the moment a source is added; there is no older history. Channels
          are polled a few times a day, and reading tools refresh them first if the last poll is over an hour old.
          Start with list_sources, then use get_recent_messages or search_messages.
          Channels often tag posts with hashtags (list_hashtags shows them); use them to filter, and
          exclude_hashtags ["реклама"] to skip ads. Include post links when you cite messages.

server:
  port: ${PORT:8080}
  # behind Railway's proxy: build https URLs (OAuth redirects, issuer) from X-Forwarded-* headers
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

connector:
  security:
    # Public base URL; Railway sets RAILWAY_PUBLIC_DOMAIN once a domain is generated.
    public-url: ${CONNECTOR_PUBLIC_URL:${RAILWAY_PUBLIC_DOMAIN:}}
    github:
      # GitHub OAuth App (Settings → Developer settings → OAuth Apps), callback: <public-url>/login/oauth2/code/github
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # comma-separated GitHub logins allowed to sign in
      allowed-logins: ${GITHUB_ALLOWED_LOGINS:}
    mcp-client:
      # entered in claude.ai when adding the connector (Advanced settings → OAuth Client ID / Secret)
      client-id: ${MCP_OAUTH_CLIENT_ID:claude}
      client-secret: ${MCP_OAUTH_CLIENT_SECRET:}
  # postgres (default) or memory: non-durable, for quick local runs and tests (profile "memory")
  persistence: postgres
  telegram:
    bot:
      # Bot API (push): private chats, groups, and channels where the bot is an admin.
      enabled: ${TELEGRAM_BOT_ENABLED:false}
      token: ${TELEGRAM_BOT_TOKEN:}
      # Anyone can message a bot or add it to a group, so keep this off and register chats via the API.
      auto-register-chats: ${TELEGRAM_BOT_AUTO_REGISTER_CHATS:false}
    channel-feed:
      # Public channels (pull) via https://t.me/s/<channel>
      base-url: https://t.me
      timeout: 10s
    polling:
      enabled: true
      # scheduled polls (Spring cron: second minute hour day month weekday; "-" disables them)
      cron: ${CONNECTOR_POLLING_CRON:0 0 7,13,19 * * *}
      zone: ${CONNECTOR_POLLING_ZONE:Europe/Prague}
      # reading messages through MCP polls first if the last poll is older than this
      max-age: ${CONNECTOR_POLLING_MAX_AGE:1h}
